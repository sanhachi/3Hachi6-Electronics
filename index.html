<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3Hachi6 Electronics</title>
  <meta name="description" content="自作デバイスのポートフォリオ">
  <meta name="theme-color" content="#f4f7f7">
  <link rel="icon" href="images/icon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-root="">

  <!-- ヘッダー:中身は shared.js が入れます(直すときは shared.js) -->
  <header class="site-header" id="site-header"></header>

  <main>

    <!-- ===== トップの大きな見出し =====
         出すデバイスは data.js の FEATURED で決めます。 -->
    <section id="featured" class="hero" aria-labelledby="hero-title"></section>

    <!-- ===== 最新のデバイス =====
         並ぶデバイスは data.js の LATEST_DEVICES で決めます(タイルの文章も data.js)。
         ここで直すのは、見出しや説明文だけです。 -->
    <section id="devices" class="section-devices" aria-labelledby="devices-title">
      <div class="container">
        <div class="section-head">
          <div>
            <p class="eyebrow">LATEST DEVICES</p>
            <h2 id="devices-title">最新のデバイス</h2>
          </div>
          <p class="section-note">開発中のものを含む、最新の4つのデバイス。</p>
        </div>
        <div class="tile-grid" data-devices="latest"></div>

        <div class="section-more">
          <a href="devices/index.html" class="btn btn-outline">すべてのデバイスを見る →</a>
        </div>
      </div>
    </section>

    <!-- ===== 最新の作品(横に流れるカード) =====
         並ぶ作品は data.js の WORKS で決めます(latest: true の作品)。
         3つ以上あれば流れ、2つ以下のときは流れずに並びます。 -->
    <section id="works" class="section-works" aria-labelledby="works-title">
      <div class="container-md">
        <div class="section-head">
          <div>
            <p class="eyebrow">LATEST WORKS</p>
            <h2 id="works-title">最新の作品</h2>
          </div>
          <p class="section-note">これまでの作品や構想をざっくりと</p>
        </div>
      </div>
      <div class="marquee">
        <div class="marquee-track">
          <ul class="work-list" data-works="latest"></ul>
        </div>
      </div>
      <div class="container-md">
        <div class="section-more">
          <a href="devices/index.html#works" class="btn btn-outline">すべての作品を見る →</a>
        </div>
      </div>
    </section>

    <!-- お問い合わせ:中身は shared.js が入れます(メールアドレスやキャッチコピーも shared.js) -->
    <section id="contact" class="section-contact" aria-labelledby="contact-title"></section>

  </main>

  <!-- フッター:中身は shared.js が入れます(直すときは shared.js) -->
  <footer class="site-footer" id="site-footer"></footer>

  <script src="data.js"></script>
  <script src="shared.js"></script>
  <script src="script.js"></script>
</body>
</html>
