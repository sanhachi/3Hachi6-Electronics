<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>デバイス一覧 — 3Hachi6 Electronics</title>
  <meta name="description" content="3Hachi6 Electronicsがつくったデバイスの一覧。開発中のものを含みます。">
  <meta name="theme-color" content="#f4f7f7">
  <link rel="icon" href="../images/icon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body data-root="../">

  <!-- ヘッダー:中身は shared.js が入れます(直すときは shared.js) -->
  <header class="site-header" id="site-header"></header>

  <main>

    <!-- ===== デバイス一覧 =====
         並ぶデバイスと、タイルの文章は data.js の DEVICES で決めます。
         ここで直すのは、見出しや説明文だけです。 -->
    <section id="devices" class="section-devices" aria-labelledby="devices-title">
      <div class="container">
        <div class="section-head">
          <div>
            <p class="eyebrow">DEVICES</p>
            <h1 id="devices-title">デバイス一覧</h1>
          </div>
          <p class="section-note">開発中のものを含む、すべてのデバイス。</p>
        </div>
        <div class="tile-grid" data-devices="all"></div>
      </div>
    </section>

    <!-- ===== その他の作品(すべて) =====
         並ぶ作品は data.js の WORKS で決めます。 -->
    <section id="works" class="section-works" aria-labelledby="works-title">
      <div class="container">
        <div class="section-head">
          <div>
            <p class="eyebrow">OTHER WORKS</p>
            <h2 id="works-title">その他の作品</h2>
          </div>
          <p class="section-note">これまでの作品や構想をざっくりと</p>
        </div>
        <ul class="work-grid" data-works="all"></ul>
      </div>
    </section>

    <!-- お問い合わせ:中身は shared.js が入れます(メールアドレスやキャッチコピーも shared.js) -->
    <section id="contact" class="section-contact" aria-labelledby="contact-title"></section>

  </main>

  <!-- フッター:中身は shared.js が入れます(直すときは shared.js) -->
  <footer class="site-footer" id="site-footer"></footer>

  <script src="../data.js"></script>
  <script src="../shared.js"></script>
  <script src="../script.js"></script>
</body>
</html>
